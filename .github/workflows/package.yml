name: Package
on: [push, pull_request, workflow_dispatch]
jobs:
  package:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: '-1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      USE_TF: '0'
      USE_FLAX: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip ruff
      - run: python -m pip install --no-deps -e .
      - run: python -m compileall -q src
      - run: python -m ruff check --select F src
      - uses: actions/checkout@v7
        with:
          repository: neuhai/CollabSim
          ref: 08ed0ed1cefb2edf1ea389b20ba8355815a7c8d0
          path: data/raw/CollabSim
          sparse-checkout: |
            src
            configs
            prompts
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install scikit-learn tokenizers pyyaml litellm boto3
      - name: Real native CollabSim controller with scripted model
        run: python tests/native_collabsim.py --source-root data/raw/CollabSim --output outputs/native-ci
